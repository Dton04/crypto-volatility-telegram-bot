name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: telecrypt
          POSTGRES_PASSWORD: telecrypt_secure_pass_135
          POSTGRES_DB: telecrypt_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://telecrypt:telecrypt_secure_pass_135@localhost:5432/telecrypt_db?schema=public

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://telecrypt:telecrypt_secure_pass_135@localhost:5432/telecrypt_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Build Application dist
        run: npm run build
        env:
          DATABASE_URL: postgresql://telecrypt:telecrypt_secure_pass_135@localhost:5432/telecrypt_db?schema=public

  docker-build:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Binance Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          build-args: |
            APP_NAME=binance-worker
          push: false # Set to true and add registry logins for production
          tags: telecrypt-binance-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Telegram Bot Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          build-args: |
            APP_NAME=telegram-bot
          push: false # Set to true and add registry logins for production
          tags: telecrypt-telegram-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
