services:
  # Database
  postgres-db:
    image: postgres:15-alpine
    container_name: telecrypt-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-telecrypt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-telecrypt_secure_pass_135}
      POSTGRES_DB: ${DB_NAME:-telecrypt_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Queue & Cache
  redis-server:
    image: redis:7-alpine
    container_name: telecrypt-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass_246}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass_246}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Worker Service (Binance Connection & Calculations)
  binance-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_NAME=binance-worker
    container_name: telecrypt-binance-worker
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-telecrypt}:${DB_PASSWORD:-telecrypt_secure_pass_135}@postgres-db:5432/${DB_NAME:-telecrypt_db}?schema=public}
      REDIS_HOST: redis-server
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_246}
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-server:
        condition: service_healthy

  # Bot Service (Telegram Commands & Alerts Consumer)
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_NAME=telegram-bot
    container_name: telecrypt-telegram-bot
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-telecrypt}:${DB_PASSWORD:-telecrypt_secure_pass_135}@postgres-db:5432/${DB_NAME:-telecrypt_db}?schema=public}
      REDIS_HOST: redis-server
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_246}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-server:
        condition: service_healthy

  # Prometheus (Metrics Collector)
  prometheus:
    image: prom/prometheus:latest
    container_name: telecrypt-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    depends_on:
      - binance-worker
      - telegram-bot

  # Grafana (Dashboard Visualizer)
  grafana:
    image: grafana/grafana:latest
    container_name: telecrypt-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
